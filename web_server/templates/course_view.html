<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Course View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #0b0f19;
            background-image: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15) 0%, transparent 40%), radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.15) 0%, transparent 40%);
            color: #fff;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            padding-bottom: max(88px, calc(16px + env(safe-area-inset-bottom)));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin: 52px 0 15px;
            width: 100%;
            max-width: 560px;
        }

        .title {
            font-size: clamp(1.35rem, 5.6vw, 1.8rem);
            font-weight: 700;
            color: #fff;
        }

        .canvas-container {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: none;
        }

        #courseCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
            font-size: 0.9rem;
            width: 100%;
            max-width: 560px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            min-height: 42px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .status-item strong {
            color: #60a5fa;
        }

        .stop-button {
            width: 100%;
            min-height: 56px;
            padding: 14px 26px;
            background: rgba(239, 68, 68, 0.4);
            border: 1px solid rgba(239, 68, 68, 0.8);
            border-radius: 30px;
            color: white;
            font-size: clamp(1.15rem, 5vw, 1.45rem);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            text-transform: uppercase;
        }

        .action-row {
            width: 100%;
            max-width: 560px;
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .action-row .stop-button {
            margin-top: 0;
            flex: 1.6;
            min-width: 0;
        }

        .calibrate-button {
            flex: 1;
            min-width: 0;
            min-height: 56px;
            border-radius: 30px;
            border: 1px solid rgba(102, 126, 234, 0.85);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: clamp(0.95rem, 4vw, 1.1rem);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .calibrate-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.5);
        }

        .calibrate-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .clear-button {
            flex: 1;
            min-width: 0;
            min-height: 56px;
            border-radius: 30px;
            border: 1px solid rgba(234, 179, 8, 0.85);
            background: linear-gradient(135deg, #ca8a04 0%, #92400e 100%);
            color: #fff;
            font-size: clamp(0.95rem, 4vw, 1.1rem);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(202, 138, 4, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clear-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 24px rgba(202, 138, 4, 0.5);
        }

        .clear-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .start-queue-button {
            flex: 1;
            min-width: 0;
            min-height: 56px;
            border-radius: 30px;
            border: 1px solid rgba(34, 197, 94, 0.85);
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            font-size: clamp(0.95rem, 4vw, 1.1rem);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .start-queue-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 24px rgba(34, 197, 94, 0.5);
        }

        .start-queue-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .queue-panel {
            width: 100%;
            max-width: 560px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
        }

        .queue-title {
            font-size: 0.9rem;
            margin-bottom: 7px;
            color: #aaa;
            letter-spacing: 0.08em;
        }

        .queue-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }

        .queue-empty {
            color: #666;
            font-size: 0.9rem;
        }

        .queue-chip {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .queue-chip.active {
            background: #22c55e;
            color: #062012;
            font-weight: 700;
        }

        .stop-button:hover {
            background: rgba(239, 68, 68, 0.6);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 25px rgba(239, 68, 68, 0.6);
        }

        .stop-button:active {
            transform: translateY(1px) scale(0.98);
            background: rgba(239, 68, 68, 0.8);
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.6);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 10px 0;
            width: 100%;
            max-width: 560px;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 0;
            min-height: 48px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .nav-button:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .nav-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .home-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .home-btn:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
        }

        .joystick-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }

        .joystick-btn:hover {
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
        }

        .connection-status {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: max(10px, env(safe-area-inset-right));
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .connection-status .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }

        .connection-status .status-dot.connected {
            background: #0ef;
            box-shadow: 0 0 10px #0ef;
            animation: pulse-connected 2s infinite;
        }

        .floating-shutdown-btn {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            min-height: 48px;
            min-width: 132px;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(249, 115, 22, 0.75);
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #fff;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(234, 88, 12, 0.35);
            z-index: 1200;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .floating-shutdown-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(234, 88, 12, 0.5);
        }

        .floating-shutdown-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        @keyframes pulse-connected {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(0, 238, 255, 0.5);
            }

            50% {
                box-shadow: 0 0 20px #0ef;
            }
        }

        @media (max-width: 680px) {
            .header {
                margin-top: 44px;
                margin-bottom: 12px;
            }

            .canvas-container {
                border-radius: 24px;
                padding: 9px;
            }

            .status-bar {
                gap: 8px;
                margin: 12px 0;
            }

            .status-item {
                flex: 1 1 calc(50% - 4px);
                justify-content: center;
                text-align: center;
            }

            .queue-panel {
                padding: 10px;
            }

            .stop-button {
                margin-top: 6px;
            }

            .action-row {
                gap: 10px;
            }

            .nav-buttons {
                gap: 10px;
                margin-top: 14px;
            }
        }

        @media (max-width: 430px) {
            .connection-status {
                padding: 6px 10px;
                font-size: 0.78rem;
            }

            .status-bar {
                display: grid;
                grid-template-columns: 1fr;
            }

            .status-item {
                flex: 1 1 100%;
            }

            .action-row {
                flex-direction: column;
            }

            .calibrate-button {
                min-height: 52px;
            }

            .nav-buttons {
                flex-direction: column;
            }

            .floating-shutdown-btn {
                min-height: 46px;
                min-width: 112px;
                padding: 8px 14px;
                font-size: 0.84rem;
            }
        }
    </style>
</head>

<body>
    <div class="connection-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="connStatus">Connecting...</span>
    </div>

    <div class="header">
        <div class="title">Course View</div>
    </div>

    <div class="canvas-container">
        <canvas id="courseCanvas"></canvas>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <strong>Pos:</strong> <span id="position">--</span>
        </div>
        <div class="status-item">
            <strong>Heading:</strong> <span id="heading">--</span>
        </div>
        <div class="status-item">
            <strong>Target:</strong> <span id="targetName">--</span>
        </div>
    </div>

    <!-- Queue Display -->
    <div class="queue-panel">
        <div class="queue-title">QUEUE</div>
        <div id="queueList" class="queue-list">
            <span class="queue-empty">Empty</span>
        </div>
    </div>

    <div class="action-row">
        <button class="stop-button" id="stopBtn">STOP</button>
        <button class="clear-button" id="clearQueueBtn">🗑️ Clear</button>
        <button class="start-queue-button" id="startQueueBtn">▶ Start Queue</button>
        <button class="calibrate-button" id="calibrateBtn">🎯 Calibrate</button>
    </div>

    <div class="nav-buttons">
        <a href="/" class="nav-button home-btn">🏠 Home</a>
        <a href="/joystick" class="nav-button joystick-btn">🎮 Joystick</a>
    </div>

    <button id="shutdownButton" class="floating-shutdown-btn">🔌 Shutdown</button>

    <script>
        const canvas = document.getElementById('courseCanvas');
        const ctx = canvas.getContext('2d');
        const stopBtn = document.getElementById('stopBtn');
        const calibrateBtn = document.getElementById('calibrateBtn');
        const shutdownButton = document.getElementById('shutdownButton');
        const connStatus = document.getElementById('connStatus');
        const statusDot = document.getElementById('statusDot');

        // Course configuration
        const BORDER = 2.5;
        const PLAY_AREA = 30;
        let courseConfig = {
            dimensions: { width: PLAY_AREA, height: PLAY_AREA },
            border: BORDER,
            playArea: PLAY_AREA,
            buckets: {
                red: [0, 0],
                yellow: [0, 30],
                blue: [30, 30],
                green: [30, 0]
            },
            center: [15, 15],
            start_position: [0, 15]
        };

        // Robot state
        let robotState = {
            x: 0,
            y: 15,
            heading: 0,  // Car points in +X direction (East)
            mode: 'idle',
            target: null,
            targetName: '--'
        };

        // Canvas settings
        const MARGIN = 30;
        let scale = 1;
        let displayWidth = 0;
        let statusReceived = false;  // Flag to prevent rendering until we get server data

        // WebSocket for stop command
        let motorSocket = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            motorSocket = new WebSocket(`${protocol}//${window.location.host}/motor`);

            motorSocket.onopen = () => {
                connStatus.textContent = 'Connected';
                statusDot.classList.add('connected');
            };

            motorSocket.onclose = () => {
                connStatus.textContent = 'Disconnected';
                statusDot.classList.remove('connected');
                setTimeout(connectWebSocket, 2000);
            };

            motorSocket.onerror = () => {
                motorSocket.close();
            };
        }

        function sendCommand(command) {
            if (motorSocket && motorSocket.readyState === WebSocket.OPEN) {
                motorSocket.send(JSON.stringify({ type: 'voice', command: command }));
            }
        }

        function sendStop() {
            sendCommand('stop');
        }

        function sendClearQueue() {
            sendCommand('clear');
        }

        function sendStartQueue() {
            sendCommand('start');
        }

        function calibrateRobot() {
            fetch('/api/calibrate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Calibration failed:', data.error);
                        return;
                    }
                    console.log('Calibration complete:', data);
                })
                .catch(err => console.error('Calibration error:', err));
        }

        function shutdownSystem() {
            if (!confirm('Are you sure you want to shutdown the system? This will save logs and stop the program.')) {
                return;
            }

            sendStop();
            shutdownButton.disabled = true;
            shutdownButton.textContent = '⏳ Shutting...';

            fetch('/api/shutdown', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Shutdown initiated:', data);
                })
                .catch(err => {
                    console.error('Shutdown error:', err);
                    shutdownButton.disabled = false;
                    shutdownButton.textContent = '🔌 Shutdown';
                });
        }


        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.max(220, container.clientWidth - 20);
            canvas.width = size;
            canvas.height = size;
            displayWidth = courseConfig.dimensions.width + 2 * BORDER;
            scale = (size - 2 * MARGIN) / displayWidth;
        }

        function toCanvasX(x) {
            return MARGIN + (x + BORDER) * scale;
        }

        function toCanvasY(y) {
            return canvas.height - MARGIN - (y + BORDER) * scale;
        }

        function drawCourse() {
            // Don't draw until we have real position data from server
            if (!statusReceived) return;

            const playArea = courseConfig.playArea || PLAY_AREA;

            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (5ft increments)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= playArea; i += 5) {
                ctx.beginPath();
                ctx.moveTo(toCanvasX(i), toCanvasY(0));
                ctx.lineTo(toCanvasX(i), toCanvasY(playArea));
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(toCanvasX(0), toCanvasY(i));
                ctx.lineTo(toCanvasX(playArea), toCanvasY(i));
                ctx.stroke();
            }

            // Draw border zone
            ctx.fillStyle = 'rgba(139, 90, 80, 0.5)';
            ctx.fillRect(toCanvasX(-BORDER), toCanvasY(playArea + BORDER), displayWidth * scale, BORDER * scale);
            ctx.fillRect(toCanvasX(-BORDER), toCanvasY(0), displayWidth * scale, BORDER * scale);
            ctx.fillRect(toCanvasX(-BORDER), toCanvasY(playArea), BORDER * scale, playArea * scale);
            ctx.fillRect(toCanvasX(playArea), toCanvasY(playArea), BORDER * scale, playArea * scale);

            // Draw play area boundary
            ctx.strokeStyle = 'rgba(150, 180, 220, 0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(toCanvasX(0), toCanvasY(playArea), playArea * scale, playArea * scale);
            ctx.setLineDash([]);

            // Draw buckets
            const bucketColors = {
                red: '#ef4444',
                yellow: '#eab308',
                blue: '#3b82f6',
                green: '#22c55e'
            };

            for (const [color, pos] of Object.entries(courseConfig.buckets)) {
                const x = toCanvasX(pos[0]);
                const y = toCanvasY(pos[1]);

                ctx.fillStyle = bucketColors[color];
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                const labelOffset = pos[1] > 15 ? -20 : 28;
                ctx.fillText(color.toUpperCase(), x, y + labelOffset);
            }

            // Draw center
            const cx = toCanvasX(courseConfig.center[0]);
            const cy = toCanvasY(courseConfig.center[1]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // Draw robot
            drawRobot();
        }

        function drawRobot() {
            const x = toCanvasX(robotState.x);
            const y = toCanvasY(robotState.y);
            const heading = robotState.heading;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-heading * Math.PI / 180);

            // Robot body
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(-10, -7, 20, 14);

            // Direction indicator
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(17, -5);
            ctx.lineTo(17, 5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Draw target line if navigating
            if (robotState.target) {
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(toCanvasX(robotState.target[0]), toCanvasY(robotState.target[1]));
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw target marker
                ctx.fillStyle = 'rgba(251, 191, 36, 0.4)';
                ctx.beginPath();
                ctx.arc(toCanvasX(robotState.target[0]), toCanvasY(robotState.target[1]), 6, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        function updateQueueDisplay(queue, queueRunning) {
            const list = document.getElementById('queueList');
            list.innerHTML = '';

            if (!queue || queue.length === 0) {
                list.innerHTML = '<span class="queue-empty">Empty</span>';
                return;
            }

            queue.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = index === 0 && queueRunning ? 'queue-chip active' : 'queue-chip';
                el.textContent = item.target;
                list.appendChild(el);
            });
        }

        function updateStatus() {
            fetch('/api/navigation/status')
                .then(response => response.json())
                .then(data => {
                    if (!data.error) {
                        robotState.x = data.x;
                        robotState.y = data.y;
                        robotState.heading = data.heading;
                        robotState.mode = data.mode || 'idle';
                        // Use current_target if available (added in backend)
                        robotState.target = data.current_target;

                        statusReceived = true;  // Mark that we've received data

                        document.getElementById('position').textContent = `(${data.x.toFixed(1)}, ${data.y.toFixed(1)})`;
                        document.getElementById('heading').textContent = `${data.heading.toFixed(0)}°`;

                        // Update target name
                        if (data.queue && data.queue.length > 0 && data.queue_running) {
                            document.getElementById('targetName').textContent = data.queue[0].target;
                        } else {
                            document.getElementById('targetName').textContent = '--';
                        }

                        updateQueueDisplay(data.queue, data.queue_running);
                        drawCourse();
                    }
                })
                .catch(() => { });
        }

        function loadCourseConfig() {
            fetch('/api/course/info')
                .then(response => response.json())
                .then(data => {
                    courseConfig.dimensions = data.dimensions || courseConfig.dimensions;
                    courseConfig.buckets = data.buckets || courseConfig.buckets;
                    courseConfig.center = data.center || courseConfig.center;
                    courseConfig.start_position = data.start_position || courseConfig.start_position;
                    courseConfig.playArea = PLAY_AREA;
                    courseConfig.border = BORDER;
                    resizeCanvas();
                    // Don't draw yet - wait for status update
                })
                .catch(() => {
                    resizeCanvas();
                    // Don't draw yet - wait for status update
                });
        }

        // Event listeners
        stopBtn.addEventListener('click', sendStop);
        stopBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendStop(); });

        const clearQueueBtn = document.getElementById('clearQueueBtn');
        clearQueueBtn.addEventListener('click', sendClearQueue);
        clearQueueBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendClearQueue(); });

        const startQueueBtn = document.getElementById('startQueueBtn');
        startQueueBtn.addEventListener('click', sendStartQueue);
        startQueueBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendStartQueue(); });

        calibrateBtn.addEventListener('click', () => {
            if (confirm('Calibrate gyro and reset to start position (0, 15)? Robot must be stationary!')) {
                calibrateRobot();
            }
        });

        shutdownButton.addEventListener('click', shutdownSystem);

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawCourse();
        });

        function toCourseX(canvasX) {
            return (canvasX - MARGIN) / scale - BORDER;
        }

        function toCourseY(canvasY) {
            return (canvas.height - MARGIN - canvasY) / scale - BORDER;
        }

        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const courseX = toCourseX(x);
            const courseY = toCourseY(y);

            fetch('/api/navigation/goto_point', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: courseX, y: courseY })
            })
                .then(r => r.json())
                .then(data => {
                    console.log('Navigating to point:', data);
                })
                .catch(err => console.error('Error:', err));
        });

        // Initialize
        connectWebSocket();
        loadCourseConfig();
        updateStatus();
        setInterval(updateStatus, 33); // 30 Hz update rate (~33ms)
    </script>
</body>

</html>
