<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASGC Joystick Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #0b0f19;
            background-image: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15) 0%, transparent 40%), radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.15) 0%, transparent 40%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            padding-bottom: max(88px, calc(16px + env(safe-area-inset-bottom)));
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            gap: 14px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 10px 0;
            width: 100%;
            max-width: 560px;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 0;
            min-height: 48px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .nav-button:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .nav-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .home-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .home-btn:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
        }

        .course-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .course-btn:hover {
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5);
        }

        .header {
            text-align: center;
            width: 100%;
            max-width: 560px;
            margin: 52px 0 0;
        }

        .title {
            font-size: clamp(1.5rem, 6.2vw, 2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #0ef 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .joystick-container {
            position: relative;
            width: min(86vw, 320px);
            height: min(86vw, 320px);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .joystick {
            width: clamp(84px, 24vw, 104px);
            height: clamp(84px, 24vw, 104px);
            background: linear-gradient(135deg, #0ef 0%, #3b82f6 100%);
            border-radius: 50%;
            cursor: move;
            position: absolute;
            box-shadow: 0 4px 20px rgba(0, 238, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.5);
            touch-action: none;
            transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.1s;
        }

        .joystick:active {
            box-shadow: 0 6px 30px rgba(0, 238, 255, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.7);
            transform: scale(0.95);
        }

        .crosshair {
            position: absolute;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair.horizontal {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: clamp(16px, 4.5vw, 24px);
            border: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            margin-top: 2px;
            text-align: center;
            width: 100%;
            max-width: 560px;
        }

        .coordinates {
            font-size: clamp(1rem, 4.5vw, 1.2rem);
            margin: 10px 0;
        }

        .status {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }

        .direction-indicator {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: 600;
            margin-top: 10px;
            color: #60a5fa;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-button {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            min-height: 46px;
            flex: 1 1 170px;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .control-button:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .control-button.stop-btn {
            background: rgba(239, 68, 68, 0.5);
            border-color: rgba(239, 68, 68, 0.8);
        }

        .control-button.stop-btn:hover {
            background: rgba(239, 68, 68, 0.7);
        }

        .control-button.shutdown-btn {
            background: rgba(249, 115, 22, 0.5);
            border-color: rgba(249, 115, 22, 0.8);
        }

        .control-button.shutdown-btn:hover {
            background: rgba(249, 115, 22, 0.7);
        }

        .motor-speeds {
            display: flex;
            justify-content: center;
            gap: clamp(14px, 6vw, 30px);
            margin: 15px 0;
        }

        .motor-speed {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .motor-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .motor-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .connection-status {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: max(10px, env(safe-area-inset-right));
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #0ef;
            box-shadow: 0 0 10px #0ef;
            animation: pulse-connected 2s infinite;
        }

        @keyframes pulse-connected {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(0, 238, 255, 0.5);
            }

            50% {
                box-shadow: 0 0 20px #0ef;
            }
        }

        .slider-container {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slider-label span {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .slider-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .pwm-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .pwm-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #0ef;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.8), inset 0 0 5px rgba(255, 255, 255, 0.8);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #fff;
        }

        .pwm-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(0, 238, 255, 1), inset 0 0 5px rgba(255, 255, 255, 1);
        }

        .pwm-slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #0ef;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.8), inset 0 0 5px rgba(255, 255, 255, 0.8);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #fff;
        }

        .pulse-width-info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .pulse-width-info strong {
            color: #60a5fa;
        }

        .floating-shutdown-btn {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            min-height: 48px;
            min-width: 132px;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(249, 115, 22, 0.75);
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #fff;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(234, 88, 12, 0.35);
            z-index: 1200;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .floating-shutdown-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(234, 88, 12, 0.5);
        }

        .floating-shutdown-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        @media (max-width: 680px) {
            .header {
                margin-top: 44px;
            }

            .connection-status {
                padding: 6px 10px;
                font-size: 0.78rem;
            }

            .slider-container {
                margin: 14px 0 6px;
                padding: 12px;
            }

            .pulse-width-info {
                flex-wrap: wrap;
                gap: 6px 12px;
                justify-content: flex-start;
            }

            .nav-buttons {
                gap: 10px;
            }
        }

        @media (max-width: 430px) {
            .motor-speeds {
                flex-direction: column;
                gap: 8px;
            }

            .control-buttons {
                flex-direction: column;
            }

            .control-button {
                width: 100%;
                flex: 1 1 auto;
            }

            .nav-buttons {
                flex-direction: column;
            }

            .floating-shutdown-btn {
                min-height: 46px;
                min-width: 112px;
                padding: 8px 14px;
                font-size: 0.84rem;
            }
        }

        /* UART Servo Actuator Section */
        .uart-section {
            margin-top: 16px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .uart-section-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .uart-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .uart-btn {
            flex: 1;
            min-height: 46px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .uart-btn:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.6);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
        }

        .uart-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .uart-up {
            background: rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.4);
        }

        .uart-up:hover {
            background: rgba(14, 165, 233, 0.35);
            border-color: rgba(14, 165, 233, 0.7);
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }

        .uart-down {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
        }

        .uart-down:hover {
            background: rgba(168, 85, 247, 0.35);
            border-color: rgba(168, 85, 247, 0.7);
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
        }

        /* ── GPIO / Ball-handling section ───────────────────────────────── */
        .gpio-section {
            margin-top: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gpio-section-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        /* Limit-switch status row */
        .switch-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .switch-badge {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 8px;
            transition: border-color 0.25s, background 0.25s;
        }

        .switch-badge.triggered {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.6);
        }

        .switch-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.25s, box-shadow 0.25s;
        }

        .switch-dot.triggered {
            background: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
            50%       { box-shadow: 0 0 18px rgba(34, 197, 94, 0.9); }
        }

        .switch-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            line-height: 1.2;
        }

        .switch-status-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.35);
            transition: color 0.25s;
        }

        .switch-status-text.triggered {
            color: #22c55e;
        }

        /* Motor toggle buttons */
        .motor-toggle-row {
            display: flex;
            gap: 10px;
        }

        .motor-btn {
            flex: 1;
            min-height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            line-height: 1.2;
        }

        .motor-btn:hover {
            transform: translateY(-1px);
        }

        .motor-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .motor-btn.motor-off {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .motor-btn.motor-off:hover {
            background: rgba(14, 165, 233, 0.2);
            border-color: rgba(14, 165, 233, 0.5);
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        }

        .motor-btn.motor-on {
            background: rgba(34, 197, 94, 0.25);
            border-color: rgba(34, 197, 94, 0.7);
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.3);
        }

        .motor-btn-label {
            font-size: 0.7rem;
            opacity: 0.6;
            font-weight: 400;
        }

        /* ── Dry-run test panel ─────────────────────────────────────────── */
        .dry-run-section {
            margin-top: 14px;
            padding: 14px 14px 10px;
            background: rgba(168, 85, 247, 0.07);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .dry-run-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .dry-run-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(168, 85, 247, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .dry-run-btns {
            display: flex;
            gap: 8px;
        }

        .dry-run-start-btn {
            min-height: 38px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid rgba(168, 85, 247, 0.6);
            background: rgba(168, 85, 247, 0.25);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dry-run-start-btn:hover:not(:disabled) {
            background: rgba(168, 85, 247, 0.45);
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }

        .dry-run-start-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .dry-run-cancel-btn {
            min-height: 38px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
        }

        .dry-run-cancel-btn.visible {
            display: block;
        }

        .dry-run-cancel-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-1px);
        }

        /* Step tracker */
        .dry-run-steps {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }

        .dry-run-step {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .dry-run-step.active {
            background: rgba(168, 85, 247, 0.7);
            box-shadow: 0 0 6px rgba(168, 85, 247, 0.6);
            animation: pulse-purple 1.2s infinite;
        }

        .dry-run-step.done {
            background: #22c55e;
            box-shadow: 0 0 5px rgba(34, 197, 94, 0.6);
            animation: none;
        }

        .dry-run-step.error {
            background: #ef4444;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse-purple {
            0%, 100% { box-shadow: 0 0 4px rgba(168, 85, 247, 0.4); }
            50%       { box-shadow: 0 0 10px rgba(168, 85, 247, 0.8); }
        }

        /* Log area */
        .dry-run-log {
            max-height: 90px;
            overflow-y: auto;
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            padding: 2px 0;
        }

        .dry-run-log-entry {
            padding: 1px 0;
        }

        .dry-run-log-entry.current {
            color: #c4b5fd;
            font-weight: 600;
        }

        .dry-run-log-entry.success {
            color: #4ade80;
            font-weight: 600;
        }

        .dry-run-log-entry.error {
            color: #f87171;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="connection-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <div class="header">
        <div class="title">🎮 Joystick Control</div>
    </div>

    <div class="joystick-container" id="joystickContainer">
        <div class="crosshair"></div>
        <div class="crosshair horizontal"></div>
        <div class="joystick" id="joystick"></div>
    </div>

    <div class="info-panel">
        <div class="coordinates">
            <strong>X:</strong> <span id="xValue">0</span> |
            <strong>Y:</strong> <span id="yValue">0</span>
        </div>
        <div class="direction-indicator" id="direction">Center</div>
        <div class="motor-speeds">
            <div class="motor-speed">
                <span class="motor-label">Left:</span>
                <span class="motor-value" id="leftSpeed">0%</span>
            </div>
            <div class="motor-speed">
                <span class="motor-label">Right:</span>
                <span class="motor-value" id="rightSpeed">0%</span>
            </div>
        </div>
        <div class="status">Tank Steering Mode</div>

        <div class="slider-container">
            <div class="slider-label">
                <span>PWM Limit</span>
                <span class="slider-value" id="pwmLimitValue">25%</span>
            </div>
            <input type="range" min="0" max="100" value="25" step="5" class="pwm-slider" id="pwmLimitSlider">
            <div class="pulse-width-info">
                <span>Min: <strong id="pwMinValue">1375</strong> µs</span>
                <span>Center: <strong>1500</strong> µs</span>
                <span>Max: <strong id="pwMaxValue">1625</strong> µs</span>
            </div>
        </div>

        <div class="control-buttons">
            <button class="control-button stop-btn" onclick="emergencyStop()">🛑 STOP</button>
        </div>

        <!-- UART Servo Actuator -->
        <div class="uart-section">
            <div class="uart-section-label">Actuator</div>
            <div class="uart-row">
                <button class="uart-btn uart-up" id="uartUpBtn" onclick="sendUartServo('up')">▲ Up</button>
                <button class="uart-btn uart-down" id="uartDownBtn" onclick="sendUartServo('down')">▼
                    Down</button>
            </div>
        </div>

        <!-- GPIO Ball-handling Section -->
        <div class="gpio-section">
            <div class="gpio-section-label">⚙️ Ball Handling — GPIO</div>

            <!-- Limit switch status -->
            <div class="switch-row">
                <div class="switch-badge" id="rollerSwitchBadge">
                    <div class="switch-dot" id="rollerSwitchDot"></div>
                    <div class="switch-label">Roller<br>Switch</div>
                    <div class="switch-status-text" id="rollerSwitchStatus">No Ball</div>
                </div>
                <div class="switch-badge" id="conveyorSwitchBadge">
                    <div class="switch-dot" id="conveyorSwitchDot"></div>
                    <div class="switch-label">Conveyor<br>Switch</div>
                    <div class="switch-status-text" id="conveyorSwitchStatus">No Ball</div>
                </div>
            </div>

            <!-- Motor toggle buttons -->
            <div class="motor-toggle-row">
                <button class="motor-btn motor-off" id="rollerMotorBtn" onclick="toggleRollerMotor()">
                    🔄 Roller Motor
                    <span class="motor-btn-label" id="rollerMotorLabel">OFF</span>
                </button>
                <button class="motor-btn motor-off" id="conveyorMotorBtn" onclick="toggleConveyorMotor()">
                    📦 Conveyor Motor
                    <span class="motor-btn-label" id="conveyorMotorLabel">OFF</span>
                </button>
            </div>

            <!-- Ball Dry Run Test -->
            <div class="dry-run-section">
                <div class="dry-run-header">
                    <span class="dry-run-title">🧪 Ball Dry Run Test</span>
                    <div class="dry-run-btns">
                        <button class="dry-run-cancel-btn" id="dryRunCancelBtn" onclick="cancelDryRun()">✕ Cancel</button>
                        <button class="dry-run-start-btn" id="dryRunStartBtn" onclick="startDryRun()">▶ Start</button>
                    </div>
                </div>
                <!-- 8-step progress bar (steps 1-8) -->
                <div class="dry-run-steps" id="dryRunSteps">
                    <div class="dry-run-step" id="drStep1" title="Start roller"></div>
                    <div class="dry-run-step" id="drStep2" title="Wait roller switch"></div>
                    <div class="dry-run-step" id="drStep3" title="Stop roller / scoop up"></div>
                    <div class="dry-run-step" id="drStep4" title="Start conveyor"></div>
                    <div class="dry-run-step" id="drStep5" title="Wait conveyor switch"></div>
                    <div class="dry-run-step" id="drStep6" title="5 s settle wait"></div>
                    <div class="dry-run-step" id="drStep7" title="Dispense 10 s"></div>
                    <div class="dry-run-step" id="drStep8" title="Complete"></div>
                </div>
                <div class="dry-run-log" id="dryRunLog"></div>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <a href="/" class="nav-button home-btn">🏠 Home</a>
        <a href="/course" class="nav-button course-btn">🗺️ Course</a>
    </div>

    <button id="shutdownButton" class="floating-shutdown-btn">🔌 Shutdown</button>

    <script>
        const joystick = document.getElementById('joystick');
        const container = document.getElementById('joystickContainer');
        const shutdownButton = document.getElementById('shutdownButton');
        const xValue = document.getElementById('xValue');
        const yValue = document.getElementById('yValue');
        const direction = document.getElementById('direction');
        const leftSpeedEl = document.getElementById('leftSpeed');
        const rightSpeedEl = document.getElementById('rightSpeed');

        let isDragging = false;
        let centerX = 0;
        let centerY = 0;
        let maxDistance = 100; // Maximum distance from center

        // PWM limit slider
        const pwmLimitSlider = document.getElementById('pwmLimitSlider');
        const pwmLimitValue = document.getElementById('pwmLimitValue');
        const pwMinValue = document.getElementById('pwMinValue');
        const pwMaxValue = document.getElementById('pwMaxValue');
        const PWM_LIMIT_KEY = 'asgc_pwm_limit';
        let pwmLimit = parseInt(localStorage.getItem(PWM_LIMIT_KEY) ?? '25', 10);

        // PWM pulse width constants (in µs)
        const PW_NEUTRAL = 1500;
        const PW_FORWARD_MAX = 2000;
        const PW_REVERSE_MAX = 1000;

        function updatePulseWidthDisplay() {
            // Calculate the limited pulse width range based on slider
            // At 0%: min = max = neutral (1500)
            // At 100%: min = 1000, max = 2000
            const minPw = Math.round(PW_NEUTRAL - (PW_NEUTRAL - PW_REVERSE_MAX) * pwmLimit / 100);
            const maxPw = Math.round(PW_NEUTRAL + (PW_FORWARD_MAX - PW_NEUTRAL) * pwmLimit / 100);

            pwMinValue.textContent = minPw;
            pwMaxValue.textContent = maxPw;
        }

        pwmLimitSlider.addEventListener('input', (e) => {
            pwmLimit = parseInt(e.target.value);
            localStorage.setItem(PWM_LIMIT_KEY, pwmLimit);
            pwmLimitValue.textContent = `${pwmLimit}%`;
            updatePulseWidthDisplay();
            sendPwmSettings();
        });

        function sendPwmSettings() {
            // Calculate min/max PWM percentages from limit
            const BASE_MIN_PWM = 100;
            const BASE_MAX_PWM = 100;

            let minPwm = Math.round(BASE_MIN_PWM * pwmLimit / 100);
            let maxPwm = Math.round(BASE_MAX_PWM * pwmLimit / 100);

            if (motorWs && motorWs.readyState === WebSocket.OPEN) {
                motorWs.send(JSON.stringify({
                    type: 'set_pwm',
                    min_pwm_percent: minPwm,
                    max_pwm_percent: maxPwm
                }));
                console.log(`PWM Limit: ${pwmLimit}% (Min=${minPwm}%, Max=${maxPwm}%)`);
            }
        }

        // WebSocket connection for motor control
        let motorWs = null;
        let commandThrottle = null;

        function connectMotorWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/motor`;

            motorWs = new WebSocket(wsUrl);

            motorWs.onopen = () => {
                console.log('Motor control WebSocket connected');
                // Set control mode to joystick for direct PWM control
                motorWs.send(JSON.stringify({ type: 'set_mode', mode: 'joystick' }));
                updateConnectionStatus(true);
                // Send current PWM limit settings
                sendPwmSettings();
            };

            motorWs.onclose = () => {
                console.log('Motor control WebSocket disconnected');
                updateConnectionStatus(false);
                // Attempt to reconnect after 2 seconds
                setTimeout(connectMotorWebSocket, 2000);
            };

            motorWs.onerror = (error) => {
                console.error('Motor WebSocket error:', error);
            };

            motorWs.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Handle PWM settings broadcast from server
                    if (data.type === 'pwm_set') {
                        const receivedMinPwm = data.min_pwm_percent || 45;
                        const receivedMaxPwm = data.max_pwm_percent || 100;

                        // Calculate the limit percentage from max_pwm (assuming BASE_MAX_PWM = 100)
                        const calculatedLimit = Math.round((receivedMaxPwm / 100) * 100);

                        // Update slider without triggering a send (avoid feedback loop)
                        if (calculatedLimit !== pwmLimit) {
                            pwmLimit = calculatedLimit;
                            localStorage.setItem(PWM_LIMIT_KEY, pwmLimit);
                            pwmLimitSlider.value = calculatedLimit;
                            pwmLimitValue.textContent = `${calculatedLimit}%`;
                            updatePulseWidthDisplay();
                            console.log(`PWM limit synchronized to ${calculatedLimit}%`);
                        }
                    } else {
                        console.log('Motor response:', data);
                    }
                } catch (e) {
                    console.error('Error parsing motor response:', e);
                }
            };
        }

        // Connect on page load
        connectMotorWebSocket();

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
            }
        }

        function emergencyStop() {
            if (motorWs && motorWs.readyState === WebSocket.OPEN) {
                motorWs.send(JSON.stringify({ type: 'stop' }));
            }
            resetJoystick();
        }

        function shutdownSystem() {
            if (confirm('Are you sure you want to shutdown the system? This will save logs and stop the program.')) {
                // Stop motors first
                emergencyStop();
                shutdownButton.disabled = true;
                shutdownButton.textContent = '⏳ Shutting...';

                // Call shutdown API
                fetch('/api/shutdown', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Shutdown initiated:', data);
                        // Update UI to show shutdown
                        document.body.innerHTML = '<div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 20px;"><h1>🔌 System Shutting Down</h1><p>Logs saved. You can close this window.</p></div>';
                    })
                    .catch(error => {
                        console.error('Shutdown error:', error);
                        shutdownButton.disabled = false;
                        shutdownButton.textContent = '🔌 Shutdown';
                        alert('Error initiating shutdown. Please try again.');
                    });
            }
        }

        function updateCenter() {
            const rect = container.getBoundingClientRect();
            centerX = rect.width / 2;
            centerY = rect.height / 2;
            const joystickRadius = joystick.offsetWidth / 2;
            maxDistance = Math.max(30, (rect.width / 2) - joystickRadius);
        }

        function getDirection(x, y) {
            const threshold = 20;
            if (Math.abs(x) < threshold && Math.abs(y) < threshold) return 'Center';

            const angle = Math.atan2(y, x) * (180 / Math.PI);

            if (angle >= -22.5 && angle < 22.5) return 'Right →';
            if (angle >= 22.5 && angle < 67.5) return 'Down-Right ↘';
            if (angle >= 67.5 && angle < 112.5) return 'Down ↓';
            if (angle >= 112.5 && angle < 157.5) return 'Down-Left ↙';
            if (angle >= 157.5 || angle < -157.5) return 'Left ←';
            if (angle >= -157.5 && angle < -112.5) return 'Up-Left ↖';
            if (angle >= -112.5 && angle < -67.5) return 'Up ↑';
            if (angle >= -67.5 && angle < -22.5) return 'Up-Right ↗';

            return 'Center';
        }

        function updateJoystick(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            let x = clientX - rect.left - centerX;
            let y = clientY - rect.top - centerY;

            // Limit to circle boundary
            const distance = Math.sqrt(x * x + y * y);
            if (distance > maxDistance) {
                const angle = Math.atan2(y, x);
                x = Math.cos(angle) * maxDistance;
                y = Math.sin(angle) * maxDistance;
            }

            // Update joystick position
            joystick.style.transform = `translate(${x}px, ${y}px)`;

            // Update values (normalized to -100 to 100)
            const normalizedX = Math.round((x / maxDistance) * 100);
            const normalizedY = Math.round((y / maxDistance) * 100);

            xValue.textContent = normalizedX;
            yValue.textContent = -normalizedY; // Invert Y for intuitive up/down

            direction.textContent = getDirection(normalizedX, -normalizedY);

            // TODO: Send control commands to car
            sendCarCommand(normalizedX, -normalizedY);
        }

        function resetJoystick() {
            joystick.style.transform = 'translate(0, 0)';
            xValue.textContent = '0';
            yValue.textContent = '0';
            direction.textContent = 'Center';

            // TODO: Send stop command to car
            sendCarCommand(0, 0);
        }

        function applyDeadzoneAndCurve(value) {
            // Deadzone: ignore small inputs
            const deadzone = 5;
            if (Math.abs(value) < deadzone) return 0;

            // Remove deadzone from the range and rescale (linear)
            const sign = value > 0 ? 1 : -1;
            const adjusted = (Math.abs(value) - deadzone) / (100 - deadzone);

            return sign * adjusted * 100;
        }

        // PWM pulse width constants (in nanoseconds) - must match motor.h
        const PW_NEUTRAL_NS = 1500000;
        const PW_FORWARD_MAX_NS = 2000000;
        const PW_REVERSE_MAX_NS = 1000000;

        function calculatePulseWidth(speedPercent) {
            // Convert -100 to 100 percent to pulse width in nanoseconds
            if (speedPercent > 0) {
                return PW_NEUTRAL_NS + (speedPercent * (PW_FORWARD_MAX_NS - PW_NEUTRAL_NS)) / 100;
            } else if (speedPercent < 0) {
                return PW_NEUTRAL_NS - (Math.abs(speedPercent) * (PW_NEUTRAL_NS - PW_REVERSE_MAX_NS)) / 100;
            } else {
                return PW_NEUTRAL_NS;
            }
        }

        function calculateTankSteering(x, y) {
            // Apply deadzone and exponential curve to reduce sensitivity
            const curvedX = applyDeadzoneAndCurve(x);
            const curvedY = applyDeadzoneAndCurve(y);

            // Tank steering: convert joystick X/Y to left/right motor speeds
            // Y controls forward/backward, X controls turning
            let leftSpeed = curvedY + curvedX;
            let rightSpeed = curvedY - curvedX;

            // Clamp to -100 to 100 range
            leftSpeed = Math.max(-100, Math.min(100, leftSpeed));
            rightSpeed = Math.max(-100, Math.min(100, rightSpeed));

            // Apply PWM limit scaling (0% = no movement, 100% = full range)
            leftSpeed = Math.round(leftSpeed * pwmLimit / 100);
            rightSpeed = Math.round(rightSpeed * pwmLimit / 100);

            // Calculate exact pulse widths in nanoseconds
            const leftPulseNs = Math.round(calculatePulseWidth(leftSpeed));
            const rightPulseNs = Math.round(calculatePulseWidth(rightSpeed));

            return { left: leftSpeed, right: rightSpeed, leftNs: leftPulseNs, rightNs: rightPulseNs };
        }

        function updateMotorDisplay(left, right) {
            leftSpeedEl.textContent = `${left}%`;
            rightSpeedEl.textContent = `${right}%`;

            // Color code based on direction
            leftSpeedEl.style.color = left > 0 ? '#22c55e' : (left < 0 ? '#ef4444' : '#60a5fa');
            rightSpeedEl.style.color = right > 0 ? '#22c55e' : (right < 0 ? '#ef4444' : '#60a5fa');
        }

        function sendCarCommand(x, y) {
            // Calculate tank steering values and pulse widths
            const { left, right, leftNs, rightNs } = calculateTankSteering(x, y);
            updateMotorDisplay(left, right);

            // Throttle commands to avoid overwhelming the motor controller
            if (commandThrottle) {
                clearTimeout(commandThrottle);
            }

            commandThrottle = setTimeout(() => {
                if (motorWs && motorWs.readyState === WebSocket.OPEN) {
                    // Send exact pulse width values in nanoseconds
                    const command = {
                        type: 'joystick',
                        leftNs: leftNs,
                        rightNs: rightNs
                    };
                    motorWs.send(JSON.stringify(command));
                    console.log(`Pulse width - Left: ${leftNs}ns, Right: ${rightNs}ns`);
                } else {
                    console.warn('Motor WebSocket not connected');
                }
            }, 10); // Send at 100Hz for smooth control
        }

        // Mouse events
        joystick.addEventListener('mousedown', (e) => {
            isDragging = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                updateJoystick(e.clientX, e.clientY);
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                resetJoystick();
            }
        });

        // Touch events
        joystick.addEventListener('touchstart', (e) => {
            isDragging = true;
            e.preventDefault();
        });

        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const touch = e.touches[0];
                updateJoystick(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        });

        document.addEventListener('touchend', () => {
            if (isDragging) {
                isDragging = false;
                resetJoystick();
            }
        });

        // Initialize
        updateCenter();
        // Restore saved PWM limit from localStorage
        pwmLimitSlider.value = pwmLimit;
        pwmLimitValue.textContent = `${pwmLimit}%`;
        updatePulseWidthDisplay();
        shutdownButton.addEventListener('click', shutdownSystem);
        window.addEventListener('resize', updateCenter);

        // UART servo commands
        // Formula: Target = Pulse(µs) * 4, split into two 7-bit bytes
        // 500µs  → 2000  (0x07D0): low=0x50, high=0x0F  [old UP]
        // 544µs  → 2176  (0x0880): low=0x00, high=0x11  [new UP +4°]
        // 1500µs → 6000  (0x1770): low=0x70, high=0x2E
        // 2500µs → 10000 (0x2710): low=0x10, high=0x4E
        const UART_SERVO_CMDS = {
            up: { pulse_us: 544, low: 0x00, high: 0x11 },
            down: { pulse_us: 1500, low: 0x70, high: 0x2E }
        };

        function sendUartServo(position) {
            const cmd = UART_SERVO_CMDS[position];
            if (!cmd) return;
            if (motorWs && motorWs.readyState === WebSocket.OPEN) {
                motorWs.send(JSON.stringify({
                    type: 'uart_servo',
                    position: position,
                    pulse_us: cmd.pulse_us,
                    low: cmd.low,
                    high: cmd.high
                }));
                console.log(`UART servo ${position}: pulse=${cmd.pulse_us}µs low=0x${cmd.low.toString(16).toUpperCase().padStart(2, '0')} high=0x${cmd.high.toString(16).toUpperCase().padStart(2, '0')}`);
            } else {
                console.warn('Motor WebSocket not connected — cannot send UART servo command');
            }
        }

        // Cross-tab PWM sync
        window.addEventListener('storage', (e) => {
            if (e.key === PWM_LIMIT_KEY && e.newValue !== null) {
                const newLimit = parseInt(e.newValue, 10);
                if (newLimit !== pwmLimit) {
                    pwmLimit = newLimit;
                    pwmLimitSlider.value = newLimit;
                    pwmLimitValue.textContent = `${newLimit}%`;
                    updatePulseWidthDisplay();
                    sendPwmSettings();
                }
            }
        });

        // ── GPIO WebSocket (roller / conveyor motors + limit switches) ──────
        let gpioWs = null;
        let _rollerOn = false;
        let _conveyorOn = false;

        function connectGpioWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            gpioWs = new WebSocket(`${protocol}//${window.location.host}/gpio`);

            gpioWs.onopen = () => {
                console.log('GPIO WebSocket connected');
            };

            gpioWs.onclose = () => {
                console.log('GPIO WebSocket disconnected — reconnecting in 2 s');
                setTimeout(connectGpioWebSocket, 2000);
            };

            gpioWs.onerror = (e) => console.error('GPIO WS error:', e);

            gpioWs.onmessage = (event) => {
                try {
                    const d = JSON.parse(event.data);
                    if (d.type === 'gpio_state') {
                        updateSwitchUI('roller',   d.roller_switch);
                        updateSwitchUI('conveyor', d.conveyor_switch);
                        updateMotorBtnUI('roller',   d.roller_motor);
                        updateMotorBtnUI('conveyor', d.conveyor_motor);
                        _rollerOn   = d.roller_motor;
                        _conveyorOn = d.conveyor_motor;
                    } else if (d.type === 'dry_run_progress') {
                        _handleDryRunProgress(d);
                    }
                } catch (e) {
                    console.error('GPIO WS parse error:', e);
                }
            };
        }

        connectGpioWebSocket();

        function updateSwitchUI(which, triggered) {
            const badge  = document.getElementById(which + 'SwitchBadge');
            const dot    = document.getElementById(which + 'SwitchDot');
            const status = document.getElementById(which + 'SwitchStatus');

            if (triggered) {
                badge.classList.add('triggered');
                dot.classList.add('triggered');
                status.classList.add('triggered');
                status.textContent = 'Ball Detected';
            } else {
                badge.classList.remove('triggered');
                dot.classList.remove('triggered');
                status.classList.remove('triggered');
                status.textContent = 'No Ball';
            }
        }

        function updateMotorBtnUI(which, isOn) {
            const btn   = document.getElementById(which + 'MotorBtn');
            const label = document.getElementById(which + 'MotorLabel');
            btn.classList.toggle('motor-on',  isOn);
            btn.classList.toggle('motor-off', !isOn);
            label.textContent = isOn ? 'ON' : 'OFF';
        }

        function setGpioMotor(type, state) {
            if (gpioWs && gpioWs.readyState === WebSocket.OPEN) {
                gpioWs.send(JSON.stringify({ type, state }));
            } else {
                console.warn('GPIO WS not connected');
            }
        }

        function toggleRollerMotor() {
            setGpioMotor('set_roller_motor', !_rollerOn);
        }

        function toggleConveyorMotor() {
            setGpioMotor('set_conveyor_motor', !_conveyorOn);
        }

        // ── Ball Dry Run ─────────────────────────────────────────────────────
        const TOTAL_STEPS = 8;
        let _dryRunActive = false;

        function _dryRunLog(message, cls = '') {
            const log = document.getElementById('dryRunLog');
            // Demote previous 'current' entries to plain
            log.querySelectorAll('.current').forEach(el => el.classList.remove('current'));
            const entry = document.createElement('div');
            entry.className = 'dry-run-log-entry' + (cls ? ' ' + cls : '');
            entry.textContent = message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function _dryRunSetStep(step, isDone, isError) {
            for (let i = 1; i <= TOTAL_STEPS; i++) {
                const el = document.getElementById('drStep' + i);
                el.classList.remove('active', 'done', 'error');
                if (i < step)  el.classList.add(isError ? 'error' : 'done');
                if (i === step && !isDone && !isError) el.classList.add('active');
                if (i === step && (isDone || isError))  el.classList.add(isError ? 'error' : 'done');
            }
        }

        function _dryRunReset() {
            for (let i = 1; i <= TOTAL_STEPS; i++) {
                document.getElementById('drStep' + i).className = 'dry-run-step';
            }
            document.getElementById('dryRunLog').innerHTML = '';
        }

        function startDryRun() {
            if (!gpioWs || gpioWs.readyState !== WebSocket.OPEN) {
                alert('GPIO WebSocket not connected.');
                return;
            }
            _dryRunReset();
            _dryRunActive = true;
            document.getElementById('dryRunStartBtn').disabled = true;
            document.getElementById('dryRunCancelBtn').classList.add('visible');
            _dryRunLog('Dry run started…', 'current');
            gpioWs.send(JSON.stringify({ type: 'start_dry_run' }));
        }

        function cancelDryRun() {
            if (gpioWs && gpioWs.readyState === WebSocket.OPEN) {
                gpioWs.send(JSON.stringify({ type: 'cancel_dry_run' }));
            }
        }

        function _handleDryRunProgress(d) {
            const step    = d.step  || 0;
            const message = d.message || '';
            const done    = !!d.done;
            const error   = !!d.error;

            if (step > 0) _dryRunSetStep(step, done, error);

            const cls = (done && !error) ? 'success' : (error ? 'error' : 'current');
            _dryRunLog(message, cls);

            if (done) {
                _dryRunActive = false;
                document.getElementById('dryRunStartBtn').disabled = false;
                document.getElementById('dryRunCancelBtn').classList.remove('visible');
                if (!error) {
                    for (let i = 1; i <= TOTAL_STEPS; i++) {
                        document.getElementById('drStep' + i).className = 'dry-run-step done';
                    }
                }
            }
        }
    </script>
</body>

</html>
